<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e4d8c"/>
      <stop offset="60%" stop-color="#0a1d37"/>
      <stop offset="100%" stop-color="#050d1a"/>
    </radialGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a6bc2"/>
      <stop offset="100%" stop-color="#081426"/>
    </linearGradient>

    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3645"/>
      <stop offset="100%" stop-color="#18202b"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base App Background Ring -->
  <circle cx="256" cy="256" r="240" fill="url(#ringGrad)" />
  <circle cx="256" cy="256" r="226" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="#255fa3" stroke-width="3" opacity="0.6" />

  <!-- Compact Top Circuit CPU Motif -->
  <g transform="translate(0, -50)">
    <!-- Traces -->
    <g opacity="0.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 236 170 L 236 125 M 256 170 L 256 110 M 276 170 L 276 125 M 322 216 L 367 216 M 322 236 L 382 236 M 322 256 L 367 256 M 190 256 L 145 256 M 190 236 L 130 236 M 190 216 L 145 216 M 236 302 L 236 320 M 256 302 L 256 325 M 276 302 L 276 320" 
            stroke="#00b0ff" stroke-width="5" fill="none" filter="url(#dropShadow)" />
      
      <circle cx="236" cy="125" r="5" fill="#00b0ff" />
      <circle cx="256" cy="110" r="5" fill="#00b0ff" />
      <circle cx="276" cy="125" r="5" fill="#00b0ff" />
      <circle cx="367" cy="216" r="5" fill="#00b0ff" />
      <circle cx="382" cy="236" r="5" fill="#00b0ff" />
      <circle cx="367" cy="256" r="5" fill="#00b0ff" />
      <circle cx="145" cy="256" r="5" fill="#00b0ff" />
      <circle cx="130" cy="236" r="5" fill="#00b0ff" />
      <circle cx="145" cy="216" r="5" fill="#00b0ff" />

      <path d="M 216 170 L 216 140 L 201 125 M 296 170 L 296 140 L 311 125 M 322 196 L 352 196 L 367 181 M 190 196 L 160 196 L 145 181" 
            stroke="#8a9ba8" stroke-width="4" fill="none" />
      <circle cx="201" cy="125" r="4" fill="#8a9ba8" />
      <circle cx="311" cy="125" r="4" fill="#8a9ba8" />
      <circle cx="367" cy="181" r="4" fill="#8a9ba8" />
      <circle cx="145" cy="181" r="4" fill="#8a9ba8" />
    </g>

    <!-- CPU Frame -->
    <rect x="190" y="170" width="132" height="132" rx="16" ry="16" fill="url(#chipGrad)" stroke="#3e4d61" stroke-width="4" filter="url(#dropShadow)"/>
    <rect x="212" y="192" width="88" height="88" rx="8" ry="8" fill="#121821" stroke="#253242" stroke-width="3"/>
    
    <!-- Glowing Center -->
    <circle cx="256" cy="236" r="10" fill="#00d2ff" filter="url(#dropShadow)" />
    <circle cx="256" cy="236" r="4" fill="#ffffff" />
  </g>

  <!-- Typography Area -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="256" y="340" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="2" filter="url(#dropShadow)">SYSTEM</text>
    <text x="256" y="385" font-size="34" font-weight="800" fill="#00b0ff" letter-spacing="1.5" filter="url(#dropShadow)">HARDWARE</text>
    <text x="256" y="428" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="3" opacity="0.9" filter="url(#dropShadow)">INFO</text>
  </g>
</svg>
